version: 2
updates:
  - package-ecosystem: npm
    directory: /
    groups:
      nextra:
        patterns:
          - nextra
          - nextra-theme-docs
      react:
        patterns:
          - react
          - react-dom
      trpc:
        patterns:
          - '@trpc/*'
      vscode-languageserver-node:
        patterns:
          - vscode-languageclient
          - vscode-languageserver
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
      - dependency-name: '@types/vscode'
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
