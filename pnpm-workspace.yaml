engineStrict: true
preferWorkspacePackages: true
shellEmulator: true

packages:
  - 'apps/*'
  - 'apps/extension/browser/*'
  - 'apps/extension/desktop/*'
  - 'packages/*'

updateConfig:
  ignoreDependencies:
    - '@types/vscode'

catalog:
  '@sveltejs/vite-plugin-svelte': ^6.2.1
  '@tsconfig/svelte': ^5.0.8
  '@types/node': 24.19.2 # https://github.com/ewanharris/vscode-versions
  '@types/vscode-webview': ^1.57.5
  svelte: ^5.57.2
  vite: ^8.0.16
  vscode-languageclient: ^10.1.2
  vscode-languageserver: ^10.1.2

overrides:
  zod: 4.3.6

allowBuilds:
  '@playwright/browser-chromium': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  sharp: true
